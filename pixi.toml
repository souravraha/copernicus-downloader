[workspace]
name = "copernicus-downloader"
version = "0.1.0"
authors = ["Sourav Raha <19655241+souravraha@users.noreply.github.com>"]
channels = ["conda-forge", "pypi"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
# CDSE Sentinel-2 L2A via eodag (OAuth2 / STAC search + resumable downloads)
eodag = ">=4.11.0,<5"
shapely = ">=2.0.0"   # only needed for --aoi-file (GeoJSON bounds)
ruff = ">=0.5.0"

[tasks]
lint = "ruff check scripts/ && ruff format scripts/"
# Copernicus Data Space Sentinel-2 L2A (eodag) - CDSE account email+password via env (public OAuth client, NO key/secret pair):
#   EODAG__cop_dataspace__auth__credentials__username / ...__password (or .envrc.local)
preview = "python scripts/download_copernicus.py --site delhi-urban --start 2025-01-01 --end 2025-02-28 --preview"
download = "python scripts/download_copernicus.py --site delhi-urban --start 2025-01-01 --end 2025-02-28 --download --max-downloads 2"
